# Tests and builds the terminal dashboard (tui/). On main, the binaries go to
# the tui-latest release, where the Windows installer downloads
# koha-nexus-windows-amd64.exe (checked against SHA256SUMS).
name: tui

on:
  push:
    branches: [main]
    paths: ['tui/**', '.github/workflows/tui.yml']
  pull_request:
    paths: ['tui/**', '.github/workflows/tui.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Build
        run: |
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/koha-nexus-$os-$arch$ext" .
          done
          (cd dist && sha256sum koha-nexus-* > SHA256SUMS && cat SHA256SUMS)
      - name: Publish to the tui-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tui-latest >/dev/null 2>&1 || \
            gh release create tui-latest --prerelease --title "koha-nexus (latest build)" \
              --notes "Terminal dashboard built from main by .github/workflows/tui.yml."
          gh release upload tui-latest dist/* --clobber
